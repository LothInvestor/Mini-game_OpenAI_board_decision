function adv(){if(ph==="stakes")show("story");else if(ph==="story")show("scene");else if(ph==="scene")show("vote");else if(ph==="read")show("why");else if(ph==="why"){if(r<4){r++;show("scene")}else show("sum")}else if(ph==="sum")show("end")}
function reset(){r=0;away=0;m=[50,50,50];mine=[];picks=[];rolls=[]}
function choose(i){reset();opened.clear();role=ROLES[i];mine=role.mx.map(q=>q.v);show("stakes")}
function home(){reset();role=null;past=[];cur=null;show("intro")}
$("next").onclick=adv;$("back").onclick=back;
$("panel").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.i){openTip(b);return}if(b.dataset.v){opened.add(b.dataset.v);const t=pop.b;t.focus();fill();return}if(b.dataset.s){opened.add("s"+b.dataset.s);shut();story();$("st"+b.dataset.s).focus();return}if(b.dataset.r)choose(+b.dataset.r);else if(b.dataset.c)pick(+b.dataset.c);else home()};
addEventListener("keydown",e=>{const n=+e.key;if(ph==="intro"&&n>=1&&n<=6)choose(n-1);else if(n>=1&&n<=3)pick(n-1);else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();if(!e.repeat)adv()}else if(e.key==="ArrowRight"&&!e.repeat)adv();else if(e.key==="ArrowLeft"&&!e.repeat)back()});
function loop(){draw();requestAnimationFrame(loop)}
tipEvents();show("intro");requestAnimationFrame(loop);
</script>
